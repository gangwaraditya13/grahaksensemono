# Neon PostgreSQL
spring.datasource.url=jdbc:postgresql://ep-billowing-snow-aoe7z8m7-pooler.c-2.ap-southeast-1.aws.neon.tech/grahaksense?sslmode=require&channelBinding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Mail Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_APPLICATION_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT & Refresh Token Config
app.jwt.access.key=${JWT_SECRET_KEY}
app.jwt.access-expiration-ms=${ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${REFRESH_EXPIRATION_MS}

# AWS S3 (Simple Storage Service)
aws.region=${AWS_REGION}
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}

# CloudFront domain (no trailing slash)
app.media.base-url=${CLOUDFRONT_URL}

# signed upload URL lifetime
app.media.upload-url-minutes=${SIGNED_UTL_LIFETIME}